<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TSUYA 新試作シリーズ01 — 比較</title>
<style>body{margin:0;background:#141616;color:#f2eee6;font:15px/1.6 system-ui}header{max-width:900px;margin:auto;padding:24px}h1{font-size:22px}a{color:inherit}label{display:inline-block;margin:8px 16px 8px 0}select,button{font:inherit;padding:8px;border:1px solid #999;background:#f2eee6;color:#151515}main{display:flex;gap:24px;justify-content:center;padding:0 16px 32px;overflow:auto}section{flex:0 0 auto}h2{font-size:15px}iframe{width:390px;height:844px;background:#08090c;border:1px solid #777;border-radius:12px}@media(max-width:700px){main{justify-content:flex-start}iframe{width:calc(100vw - 40px);max-width:390px}}p{max-width:65ch}</style>
<header><h1>新試作シリーズ01 / mobile126 比較</h1><p>既存の作品・8作品の素材を維持した別案です。左が元版、右が新試作。スマートフォンでは横へ送って比較できます。</p><label>画面 <select id="route"><option value="">トップ</option><option value="?work=COLOR">作品と5本</option><option value="?mode=custom&from=COLOR">写真からつくる</option><option value="?access=large">見やすい表示</option></select></label><label>寸法 <select id="size"><option value="390,844">390 × 844</option><option value="375,667">375 × 667</option><option value="320,568">320 × 568</option></select></label><p><a href="experience-prototype/">新試作を全画面で開く</a> · <a href="../experience-prototype/">既存公開版を開く</a></p></header>
<main><section><h2>既存公開版</h2><iframe id="before" title="既存公開版" src="../experience-prototype/"></iframe></section><section><h2>新試作シリーズ01</h2><iframe id="after" title="新試作シリーズ01" src="experience-prototype/"></iframe></section></main>
<script>const before=document.getElementById('before'),after=document.getElementById('after');document.getElementById('route').onchange=e=>{before.src='../experience-prototype/'+e.target.value;after.src='experience-prototype/'+e.target.value};document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');for(const f of [before,after]){f.style.width=w+'px';f.style.height=h+'px';}};</script></html>
