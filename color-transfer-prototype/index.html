<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>TSUYA — 色の受け渡し 試作116</title>
  <style>
    :root{--ink:#0b0b0d;--paper:#f2eee8;--muted:rgba(242,238,232,.62);--line:rgba(242,238,232,.28);--accent:#d14f78}
    *{box-sizing:border-box} body{margin:0;min-width:320px;background:var(--ink);color:var(--paper);font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
    button,label{font:inherit}button{cursor:pointer} button:focus-visible,label:focus-within{outline:2px solid #fff;outline-offset:4px}
    main{position:relative;display:grid;min-height:100svh;overflow:hidden;background:#09090b}
    .stage{position:absolute;inset:0;isolation:isolate}.stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.13) 43%,rgba(0,0,0,.86));pointer-events:none;z-index:1}
    video,.source-preview{width:100%;height:100%;object-fit:cover;filter:saturate(.86) contrast(1.05);opacity:.93}.source-preview{display:none}
    .grain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.2;background-image:radial-gradient(rgba(255,255,255,.8) .45px,transparent .7px);background-size:4px 4px;mix-blend-mode:soft-light}
    .content{position:relative;z-index:4;align-self:end;padding:32px 22px calc(24px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:auto}
    .eyebrow{margin:0 0 12px;color:var(--muted);font:500 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em}.title{margin:0;font-size:clamp(38px,12vw,62px);font-weight:400;letter-spacing:.1em}.statement{max-width:23em;margin:16px 0 24px;font-size:16px;line-height:1.9;letter-spacing:.08em}
    .action{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;border:1px solid var(--line);padding:0 17px;color:var(--paper);background:rgba(10,10,12,.27);backdrop-filter:blur(7px);font-size:15px;letter-spacing:.08em;text-align:left}.action span:last-child{font-size:24px;font-weight:300}.privacy{margin:12px 1px 0;color:var(--muted);font-size:11px;line-height:1.65;letter-spacing:.04em}
    .panel{position:relative;z-index:8;display:none;align-self:end;width:100%;max-width:640px;margin:auto;padding:18px 18px calc(20px + env(safe-area-inset-bottom));background:rgba(8,8,10,.93);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
    .panel.show{display:block;animation:rise .55s cubic-bezier(.19,.7,.22,1) both}@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
    .panel-kicker{margin:0;color:var(--muted);font:500 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em}.panel h2{margin:8px 0 5px;font-size:23px;font-weight:400;letter-spacing:.06em}.panel p{margin:0;color:var(--muted);font-size:13px;line-height:1.75}
    .nails{display:flex;align-items:flex-end;justify-content:center;gap:11px;height:116px;margin:18px 0 12px}.nail{position:relative;width:38px;height:76px;overflow:hidden;border:1px solid rgba(255,255,255,.36);border-radius:24px 24px 12px 12px;background:var(--nail);box-shadow:0 8px 18px rgba(0,0,0,.28);transform:translateY(13px);opacity:0}.nail:nth-child(2),.nail:nth-child(4){height:88px;transform:translateY(7px)}.nail:nth-child(3){height:100px;transform:translateY(0)}.nail::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 42%,rgba(255,255,255,.26) 43%,transparent 48%);mix-blend-mode:soft-light}.panel.arrived .nail{animation:nail-arrive .7s cubic-bezier(.15,.8,.25,1) calc(var(--i)*80ms) forwards}@keyframes nail-arrive{from{opacity:0;transform:translateY(32px) scale(.78)}to{opacity:1;transform:translateY(var(--lift,13px)) scale(1)}}.nail:nth-child(2),.nail:nth-child(4){--lift:7px}.nail:nth-child(3){--lift:0}
    .continue{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;margin-top:16px;padding:0 14px;border:0;color:#111;background:#f2eee8;font-size:14px;letter-spacing:.08em}.continue:disabled{opacity:.45}.source-controls{display:none;margin-top:16px}.source-controls.show{display:grid;gap:10px}.upload{display:flex;align-items:center;justify-content:space-between;min-height:54px;padding:0 14px;border:1px solid var(--line);color:var(--paper);font-size:14px;letter-spacing:.06em}.upload input{position:absolute;width:1px;height:1px;opacity:0}.source-label{display:flex;align-items:center;gap:10px;min-width:0}.swatches{display:flex;gap:6px;margin-top:11px}.swatch{width:18px;height:18px;border:1px solid rgba(255,255,255,.65);border-radius:50%;background:var(--c)}
    .transfer{position:fixed;z-index:30;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(255,255,255,.4),0 0 16px var(--c);pointer-events:none;animation:transfer 1.2s cubic-bezier(.14,.74,.22,1) var(--delay) both}@keyframes transfer{0%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(.3)}12%{opacity:1}78%{opacity:.92}100%{opacity:0;transform:translate(var(--x2),var(--y2)) scale(.66)}}
    .caption{display:none;position:absolute;z-index:5;top:calc(18px + env(safe-area-inset-top));left:20px;right:20px;color:rgba(255,255,255,.84);font:500 10px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em}.caption.show{display:block}.complete{display:none;position:absolute;z-index:10;top:calc(18px + env(safe-area-inset-top));right:18px;padding:8px 10px;border:1px solid var(--line);background:rgba(8,8,10,.52);color:#fff;font-size:11px;letter-spacing:.08em}.complete.show{display:block}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.transfer{display:none}}
  </style>
</head>
<body>
  <main>
    <div class="stage"><video id="art" autoplay muted loop playsinline preload="auto" src="../experience-prototype/art-assets/color-pattern.mp4"></video><img class="source-preview" id="preview" alt="選んだ写真のプレビュー"><div class="grain"></div></div>
    <div class="caption" id="caption">01 / COLOR → NAIL SURFACE → HAND</div><div class="complete" id="complete">色を受け取った</div>
    <section class="content" id="opening"><p class="eyebrow">TSUYA / COLOUR TRANSFER STUDY</p><h1 class="title">艶</h1><p class="statement">画面にある色と光を、<br>あなたの身体の表面へ。</p><button class="action" id="receive"><span>この作品から受け取る</span><span>→</span></button></section>
    <section class="panel" id="panel" aria-live="polite"><p class="panel-kicker" id="kicker">ARTWORK / COLOUR</p><h2 id="panelTitle">五つの表面へ定着する</h2><p id="panelText">作品から採った色だけで、5本のネイルを組み立てます。</p><div class="nails" id="nails" aria-label="五本のネイルデザイン"></div><button class="continue" id="bring">自分の世界の色を持ち込む <span>→</span></button><div class="source-controls" id="sourceControls"><label class="upload"><span class="source-label"><span id="fileName">写真を選ぶ</span></span><span>＋</span><input id="file" type="file" accept="image/*"></label><div id="swatches" class="swatches" aria-label="写真から読み取った色"></div><p>写真はこの端末内でだけ読み取ります。外部には送信しません。</p></div></section>
  </main>
  <script>
    const artworkPalette=['#d14f78','#d987a1','#6e243f','#f0d1ce','#9e6269'];
    const $=id=>document.getElementById(id), nails=$('nails');
    function renderNails(palette){nails.replaceChildren(...palette.slice(0,5).map((color,i)=>{const n=document.createElement('span');n.className='nail';n.style.setProperty('--nail',color);n.style.setProperty('--i',i);return n;}));}
    function particles(palette,origin){const rect=origin.getBoundingClientRect(), target=nails.getBoundingClientRect();palette.forEach((color,i)=>{for(let copy=0;copy<2;copy++){const p=document.createElement('i');p.className='transfer';p.style.setProperty('--c',color);p.style.setProperty('--x1',(rect.left+rect.width*(.25+.5*(i%3)/2))+'px');p.style.setProperty('--y1',(rect.top+rect.height*(.35+.25*(i%2)))+'px');p.style.setProperty('--x2',(target.left+target.width*(.16+i*.17)+(copy?7:-5))+'px');p.style.setProperty('--y2',(target.top+target.height*(.42+(copy?-.12:.1)))+'px');p.style.setProperty('--delay',(i*70+copy*35)+'ms');document.body.appendChild(p);setTimeout(()=>p.remove(),1500);}})}
    function arrive(palette,origin,kind='ARTWORK / COLOUR'){renderNails(palette);$('kicker').textContent=kind;$('panel').classList.add('show');$('caption').classList.add('show');requestAnimationFrame(()=>{particles(palette,origin);setTimeout(()=>{$('panel').classList.add('arrived');$('complete').classList.add('show')},620)});}
    $('receive').onclick=()=>{ $('opening').style.display='none'; arrive(artworkPalette,$('art')); };
    $('bring').onclick=()=>{$('bring').style.display='none';$('sourceControls').classList.add('show');$('panelTitle').textContent='写真から、もう一度受け取る';$('panelText').textContent='同じ変換を、あなたが持ち込んだ世界へ。';};
    function hex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
    function extractPalette(img){const c=document.createElement('canvas'),s=80;c.width=c.height=s;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,s,s);const data=x.getImageData(0,0,s,s).data,buckets={};for(let i=0;i<data.length;i+=4){let[r,g,b]=data.slice(i,i+3);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0;if((sat<.08&&(mx>220||mx<38))||mx>250)continue;const key=`${r>>4}_${g>>4}_${b>>4}`;const z=buckets[key]||(buckets[key]={r:0,g:0,b:0,n:0});z.r+=r;z.g+=g;z.b+=b;z.n++;}const candidates=Object.values(buckets).sort((a,b)=>b.n-a.n),out=[];for(const z of candidates){const color={r:z.r/z.n,g:z.g/z.n,b:z.b/z.n};if(out.every(q=>Math.hypot(color.r-q.r,color.g-q.g,color.b-q.b)>46))out.push(color);if(out.length===5)break;}while(out.length<5)out.push(out[out.length-1]||{r:210,g:170,b:160});return out.map(v=>hex(v.r,v.g,v.b));}
    $('file').addEventListener('change',event=>{const file=event.target.files[0];if(!file)return;$('fileName').textContent=file.name.replace(/\.[^.]+$/,'').slice(0,26);const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const palette=extractPalette(img);$('preview').src=url;$('preview').style.display='block';$('art').style.display='none';$('swatches').replaceChildren(...palette.map(c=>{const s=document.createElement('i');s.className='swatch';s.style.setProperty('--c',c);return s;}));$('panel').classList.remove('arrived');$('complete').classList.remove('show');arrive(palette,$('preview'),'PERSONAL IMAGE / COLOUR');$('panelTitle').textContent='あなたの世界が、表面になる';$('panelText').textContent='読み取った色だけが、同じ5本の構成へ定着します。';};img.src=url;event.target.value='';});
  </script>
</body>
</html>
