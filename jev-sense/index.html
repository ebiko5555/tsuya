<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>艶 II — 触れたことば</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh; margin: 0; overflow-x: hidden; color: #f4f0e8;
      background: radial-gradient(circle at 50% 22%, #363329 0, #141411 34%, #070707 72%);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    }
    main { width: min(100%, 560px); min-height: 100svh; margin: auto; padding: max(28px, env(safe-area-inset-top)) 24px max(30px, env(safe-area-inset-bottom)); display: grid; align-content: center; gap: 28px; }
    header { text-align: center; }
    .mark { color: #d6b36a; font-size: 12px; letter-spacing: .24em; }
    h1 { margin: 12px 0 8px; font-size: clamp(32px, 10vw, 48px); font-weight: 400; letter-spacing: .12em; }
    .lead { margin: 0; color: #c8c1b3; font-size: 15px; line-height: 1.8; }
    .sense-form { display: grid; gap: 12px; }
    label { font-size: 14px; letter-spacing: .08em; }
    textarea { width: 100%; min-height: 116px; resize: vertical; border: 1px solid #665e4d; border-radius: 2px; padding: 16px; background: rgba(11,11,10,.78); color: #fff; font: inherit; font-size: 17px; line-height: 1.65; }
    textarea:focus { outline: 1px solid #d6b36a; border-color: #d6b36a; }
    button { min-height: 54px; border: 1px solid #d6b36a; border-radius: 2px; background: #d6b36a; color: #15130d; font: inherit; font-size: 16px; letter-spacing: .13em; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .58; }
    .notice { margin: 0; color: #958f84; font-size: 12px; line-height: 1.65; }
    #result { min-height: 162px; border-top: 1px solid rgba(214,179,106,.62); padding-top: 24px; text-align: center; }
    #result[hidden] { display: none; }
    .result-kicker { color: #d6b36a; font-size: 11px; letter-spacing: .2em; }
    .result-title { margin: 13px 0 9px; font-size: 27px; font-weight: 400; letter-spacing: .08em; }
    .result-text { margin: 0 auto; max-width: 26em; color: #d7d0c3; font-size: 16px; line-height: 1.9; }
    .axes { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .axis { border: 1px solid #625b4e; padding: 7px 10px; color: #c9c0ae; font-size: 12px; letter-spacing: .06em; }
    .error { color: #ebb0a5; font-size: 14px; line-height: 1.7; }
    footer { text-align: center; color: #79746a; font: 11px/1.6 system-ui, sans-serif; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">TSUYA II / JEV STUDY 01</div>
      <h1>触れたことば</h1>
      <p class="lead">今日、手に残っている感覚をひとつ書いてください。<br>言葉が、表面と動きにほどけます。</p>
    </header>

    <form class="sense-form" id="senseForm">
      <label for="memory">手に残っているもの</label>
      <textarea id="memory" maxlength="800" required placeholder="例：雨上がりの手すりが、冷たくて少しざらざらしていた"></textarea>
      <button id="submitButton" type="submit">ほどく</button>
      <p class="notice">入力した言葉だけをJevで3つの感覚に分けます。写真・カメラ映像は送信しません。</p>
    </form>

    <section id="result" hidden aria-live="polite"></section>
    <footer><a href="../">艶 II へ戻る</a></footer>
  </main>

  <script>
    const endpoint = "https://tsuya-jev.emikococoro11.workers.dev";
    const form = document.querySelector("#senseForm");
    const memory = document.querySelector("#memory");
    const button = document.querySelector("#submitButton");
    const result = document.querySelector("#result");

    const words = {
      temperature: { cool: "冷たさ", neutral: "中間の温度", warm: "ぬくもり" },
      surface: { smooth: "なめらかさ", grainy: "粒立ち", fluid: "流動性", rough: "粗さ" },
      gesture: { hold: "留める", trace: "なぞる", press: "押す", float: "浮かべる" }
    };

    const lines = {
      "cool|smooth|trace": "冷たい面に、指先だけが細く残る。",
      "warm|rough|hold": "掌に残る温度が、表面の凹凸を覚えている。",
      "warm|fluid|float": "やわらかな熱が、輪郭の外までほどけていく。",
      "cool|grainy|press": "粒のある冷たさが、押した場所から静かに返ってくる。"
    };

    function renderAnswer(answers) {
      const temperature = answers.temperature.choice;
      const surface = answers.surface.choice;
      const gesture = answers.gesture.choice;
      const key = [temperature, surface, gesture].join("|");
      const line = lines[key] || `${words.temperature[temperature]}と${words.surface[surface]}。指先は、${words.gesture[gesture]}ように記憶している。`;
      result.innerHTML = `
        <div class="result-kicker">SENSE / ${Math.round((answers.temperature.confidence + answers.surface.confidence + answers.gesture.confidence) / 3 * 100)}%</div>
        <h2 class="result-title">${words.surface[surface]}</h2>
        <p class="result-text">${line}</p>
        <div class="axes">
          <span class="axis">${words.temperature[temperature]}</span>
          <span class="axis">${words.surface[surface]}</span>
          <span class="axis">${words.gesture[gesture]}</span>
        </div>`;
      result.hidden = false;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const state = memory.value.trim();
      if (!state) return;
      button.disabled = true;
      button.textContent = "よんでいます";
      result.hidden = false;
      result.innerHTML = '<p class="result-text">指先の記憶をほどいています。</p>';
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            state,
            questions: {
              temperature: { type: "choice", instructions: "この言葉が伝える温度感", criteria: { cool: "冷たさ、澄み、硬さ", neutral: "温度を強く感じない", warm: "ぬくもり、熱、やわらかさ" } },
              surface: { type: "choice", instructions: "この言葉が伝える表面の感触", criteria: { smooth: "なめらか、つるつる、光沢", grainy: "粒、粉、細かな凹凸", fluid: "水分、粘り、流れ、にじみ", rough: "ざらざら、硬い、荒い、大きな凹凸" } },
              gesture: { type: "choice", instructions: "この感覚にもっとも近い手の動き", criteria: { hold: "包む、留める、握る", trace: "なぞる、撫でる、たどる", press: "押す、叩く、触れる", float: "浮かべる、離す、風に触れる" } }
            }
          })
        });
        const data = await response.json();
        if (!response.ok || !data.answers) throw new Error(data.error || "応答を受け取れませんでした。");
        renderAnswer(data.answers);
      } catch (error) {
        result.innerHTML = `<p class="error">${error.message || "通信に失敗しました。もう一度お試しください。"}</p>`;
      } finally {
        button.disabled = false;
        button.textContent = "ほどく";
      }
    });
  </script>
</body>
</html>
